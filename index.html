<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --hover-color: #666666;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --text-color: #ffffff;
                --hover-color: #aaaaaa;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        nav ul {
            list-style: none;
            text-align: center;
        }

        nav li {
            margin: 1.5rem 0;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 1.5rem;
            letter-spacing: 0.05em;
            display: inline-block;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
            color 0.25s ease,
            opacity 0.25s ease;
        }

        nav a:hover {
            color: var(--hover-color);
            transform: translateY(-2px) scale(1.05);
        }
    </style>
</head>
<body>

<nav>
    <ul>
        <li><a href="https://akshitv2.github.io/DevNotes/">Dev Notes</a></li>
        <li><a href="https://akshitv2.github.io/MLLearning/">ML Notes</a></li>
        <li><a href="https://akshitv2.github.io/RecipeBook/recipeBook.html">Recipes</a></li>
        <li><a href="https://akshitv2.github.io/RecipeBook/cocktails.html">Cocktails</a></li>
        <li><a href="https://akshitv2.github.io/test-jekyll-publishing/">Jekyll Pages</a></li>
        <li><a href="https://akshitv2.github.io/WatchListDemo/">Watch List</a></li>
    </ul>
</nav>

</body>
</html>
